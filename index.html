<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="%BASE_URL%favicon.ico?v=desktop-transparent-2" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg?v=desktop-transparent-2" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/icon-desktop-180.png?v=2" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest?v=desktop-transparent-2" />
    <script>
      // iPadOS may identify as a Mac; window width does not identify the platform.
      const mobileAppIcons = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
        || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)
      if (mobileAppIcons) {
        document.querySelector('link[rel="manifest"]').href = '%BASE_URL%manifest-mobile.webmanifest'
        document.querySelector('link[rel="apple-touch-icon"]').href = '%BASE_URL%icons/apple-touch-icon.png'
      }
    </script>
    <meta name="theme-color" content="#2563eb" />
    <meta name="application-name" content="时间规划器" />
    <meta name="apple-mobile-web-app-title" content="时间规划器" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="现代化大学生时间规划器 - 专业的日程管理工具" />
    <title>时间规划器 - University Time Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
