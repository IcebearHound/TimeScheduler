name: Deploy account authorization service

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorization-service
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:worker
      - run: npm test
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config worker/wrangler.jsonc
          secrets: |
            AUTH_STATE_SECRET
            GITHUB_CLIENT_ID
            GITHUB_CLIENT_SECRET
            GITEE_CLIENT_ID
            GITEE_CLIENT_SECRET
        env:
          AUTH_STATE_SECRET: ${{ secrets.AUTH_STATE_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GH_OAUTH_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GH_OAUTH_CLIENT_SECRET }}
          GITEE_CLIENT_ID: ${{ secrets.GITEE_CLIENT_ID }}
          GITEE_CLIENT_SECRET: ${{ secrets.GITEE_CLIENT_SECRET }}
